<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator / Ocean Crash Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #0b141d;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .game-container {
      width: 100%;
      max-width: 800px;
      background: #121e2b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .display-area {
      position: relative;
      width: 100%;
      height: 400px;
      background: linear-gradient(to bottom, #0288d1, #01579b, #002171);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .multiplier-overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(0,0,0,0.7);
      pointer-events: none;
    }
    .controls {
      padding: 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #1a2634;
    }
    .btn {
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-start { background-color: #2e7d32; color: #fff; }
    .btn-start:disabled { background-color: #555; cursor: not-allowed; }
    .btn-cashout { background-color: #f57c00; color: #fff; }
    .btn-cashout:disabled { background-color: #555; cursor: not-allowed; }
    .stats {
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="display-area">
    <canvas id="oceanCanvas"></canvas>
    <div id="multiplier" class="multiplier-overlay">1.00x</div>
  </div>
  <div class="controls">
    <div class="stats">
      <div>Balance: $<span id="balance">100.00</span></div>
    </div>
    <button id="startBtn" class="btn btn-start">Start Round</button>
    <button id="cashoutBtn" class="btn btn-cashout" disabled>Cash Out</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('oceanCanvas');
  const ctx = canvas.getContext('2d');
  const multiplierEl = document.getElementById('multiplier');
  const startBtn = document.getElementById('startBtn');
  const cashoutBtn = document.getElementById('cashoutBtn');
  const balanceEl = document.getElementById('balance');

  let width, height;
  function resize() {
    width = canvas.width = canvas.offsetWidth;
    height = canvas.height = canvas.offsetHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Game state
  let isRunning = false;
  let currentMultiplier = 1.00;
  let crashMultiplier = 1.00;
  let animationFrame;
  let startTime = 0;
  let balance = 100.00;
  let waveOffset = 0;
  let splashParticles = [];

  // Random Crash Target Generator (RTP / Odds Logic unchanged)
  function getTargetMultiplier() {
    const rand = Math.random();
    if (rand < 0.05) return 1.00; // instant crash
    return parseFloat((1.01 + Math.pow(Math.random(), 2) * 15).toFixed(2));
  }

  // Draw Ocean Background with Depth Effect and Waves
  function drawOcean() {
    // Ocean depth gradient
    let grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, '#0288d1'); // Top surface
    grad.addColorStop(0.5, '#01579b'); // Mid depth
    grad.addColorStop(1, '#002171'); // Deep ocean
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Animated Ocean Waves
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.beginPath();
    for (let x = 0; x <= width; x += 20) {
      let y = Math.sin((x + waveOffset) * 0.02) * 8 + 40;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.closePath();
    ctx.fill();

    waveOffset += 1.5;
  }

  // Calculate trajectory restricted within middle vertical zone
  function getObjectPosition(progress, isCrashed) {
    // Horizontal progress
    let x = 50 + progress * (width - 100);

    // Vertical boundary: Middle zone (30% to 70% of canvas height)
    let minY = height * 0.3; // Top-most limit (doesn't go above)
    let maxY = height * 0.7; // Bottom-most limit

    // Smooth curve path staying within the mid-range
    let y = maxY - (Math.sin(progress * Math.PI * 0.5) * (maxY - minY));

    return { x, y };
  }

  // Draw Submarine / Plane Object
  function drawObject(pos) {
    ctx.save();
    ctx.translate(pos.x, pos.y);

    // Draw Submarine Body
    ctx.fillStyle = '#ffb300';
    ctx.beginPath();
    ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Periscope
    ctx.fillStyle = '#ffa000';
    ctx.fillRect(-2, -14, 4, 8);
    ctx.fillRect(2, -14, 6, 3);

    // Propeller bubble effect
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.beginPath();
    ctx.arc(-24, 0, Math.random() * 4 + 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Splash Effect Trigger
  function createSplash(x, y) {
    splashParticles = [];
    for (let i = 0; i < 35; i++) {
      splashParticles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.7) * 8,
        radius: Math.random() * 4 + 2,
        alpha: 1
      });
    }
  }

  // Update & Draw Splash Particles
  function drawSplash() {
    splashParticles.forEach((p, index) => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.2; // Gravity
      p.alpha -= 0.02;

      if (p.alpha <= 0) {
        splashParticles.splice(index, 1);
      } else {
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  // Main Loop
  function gameLoop(timestamp) {
    if (!startTime) startTime = timestamp;
    let elapsed = (timestamp - startTime) / 1000;

    drawOcean();

    if (isRunning) {
      // Speed multiplier rate
      let speedFactor = crashMultiplier < 2.0 ? 0.4 : 0.15;
      currentMultiplier = parseFloat((1.00 + Math.pow(elapsed * speedFactor, 2)).toFixed(2));

      if (currentMultiplier >= crashMultiplier) {
        currentMultiplier = crashMultiplier;
        isRunning = false;
        onCrash();
      }

      // Progress normalized (0 to 1) based on crash duration
      let progress = Math.min(currentMultiplier / (crashMultiplier * 1.1), 0.95);
      let pos = getObjectPosition(progress, false);
      
      drawObject(pos);
      multiplierEl.textContent = currentMultiplier.toFixed(2) + 'x';
      multiplierEl.style.color = '#ffffff';

      animationFrame = requestAnimationFrame(gameLoop);
    } else {
      // Render Splash Animation on Crash
      drawSplash();
      if (splashParticles.length > 0) {
        animationFrame = requestAnimationFrame(gameLoop);
      }
    }
  }

  function onCrash() {
    multiplierEl.textContent = 'CRASHED @ ' + crashMultiplier.toFixed(2) + 'x';
    multiplierEl.style.color = '#ff5252';
    
    let progress = Math.min(currentMultiplier / (crashMultiplier * 1.1), 0.95);
    let crashPos = getObjectPosition(progress, true);
    
    createSplash(crashPos.x, crashPos.y);
    
    startBtn.disabled = false;
    cashoutBtn.disabled = true;
  }

  // Event Handlers
  startBtn.addEventListener('click', () => {
    if (balance < 10) return;
    balance -= 10;
    balanceEl.textContent = balance.toFixed(2);

    crashMultiplier = getTargetMultiplier();
    currentMultiplier = 1.00;
    isRunning = true;
    startTime = 0;

    startBtn.disabled = true;
    cashoutBtn.disabled = false;

    cancelAnimationFrame(animationFrame);
    animationFrame = requestAnimationFrame(gameLoop);
  });

  cashoutBtn.addEventListener('click', () => {
    if (!isRunning) return;
    
    isRunning = false;
    let winAmount = 10 * currentMultiplier;
    balance += winAmount;
    balanceEl.textContent = balance.toFixed(2);
    
    multiplierEl.textContent = 'CASHOUT @ ' + currentMultiplier.toFixed(2) + 'x';
    multiplierEl.style.color = '#4caf50';

    startBtn.disabled = false;
    cashoutBtn.disabled = true;
  });

  // Initial Background Render
  drawOcean();
</script>

</body>
</html>
